bundle:
  name: product_launch_forecast

include:
  - resources/*.yml

variables:
  catalog:
    description: Dedicated UC catalog for this project (one per environment)
    default: patricia_aws_serverless_catalog
  warehouse_id:
    description: SQL warehouse ID for AI functions and queries
  notification_email:
    description: Email for job failure alerts
    default: patricia.ferreiro@databricks.com
  volume_path:
    description: Volume path where client documents are dropped
    default: /Volumes/${var.catalog}/bronze/raw_documents
  prod_sp_name:
    description: Service principal application ID the prod job and app run as
    default: ""
  lakebase_project_id:
    description: Lakebase Autoscaling project that backs the app review queue
    default: product-launch-forecast
  genie_space_id:
    description: Genie space the app's Ask Genie panel uses (sales forecasts and changeover impact)
    default: 01f1e6612342119ab7b18d1c5e460db0

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-patricia-aws-serverless.cloud.databricks.com
    variables:
      warehouse_id: 8798ee4dedf46420

  prod:
    mode: production
    workspace:
      host: https://your-prod-workspace.cloud.databricks.com
    run_as:
      service_principal_name: ${var.prod_sp_name}
