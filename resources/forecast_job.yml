resources:
  jobs:
    product_launch_forecast_job:
      name: "[${bundle.target}] Product Launch Forecast Pipeline"
      description: "End-to-end pipeline: parse client documents, extract product data, run forecast"

      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: "Europe/Madrid"

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ../src/setup_catalog.sql.py
            base_parameters:
              catalog: ${var.catalog}
            warehouse_id: ${var.warehouse_id}
          description: "Create catalog, schemas, and tables if they don't exist"

        - task_key: extract_product_data
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../src/extraction/extract_product_data.sql.py
            base_parameters:
              catalog: ${var.catalog}
            warehouse_id: ${var.warehouse_id}
          description: "Parse documents and extract standardized product launch data"

        - task_key: run_forecast
          depends_on:
            - task_key: extract_product_data
          notebook_task:
            notebook_path: ../src/forecasting/run_forecast.sql.py
            base_parameters:
              catalog: ${var.catalog}
            warehouse_id: ${var.warehouse_id}
          description: "Generate 12-week launch forecasts per client"

        # Second model for comparison: global LightGBM tracked in MLflow (serverless compute)
        - task_key: forecast_mlflow
          depends_on:
            - task_key: extract_product_data
          notebook_task:
            notebook_path: ../src/forecasting/run_forecast_mlflow.ipynb
            base_parameters:
              catalog: ${var.catalog}
          description: "Retrain the MLflow LightGBM model and write gold.launch_forecasts_mlflow"

        # Weekly unit sales per product: ai_forecast on the SQL warehouse, then the MLflow model (serverless)
        - task_key: run_sales_forecast
          depends_on:
            - task_key: extract_product_data
          notebook_task:
            notebook_path: ../src/forecasting/run_sales_forecast.ipynb
            base_parameters:
              catalog: ${var.catalog}
            warehouse_id: ${var.warehouse_id}
          description: "ai_forecast of weekly unit sales per product, plus 12-week holdout accuracy"

        - task_key: sales_forecast_mlflow
          depends_on:
            - task_key: run_sales_forecast
          notebook_task:
            notebook_path: ../src/forecasting/run_sales_forecast_mlflow.ipynb
            base_parameters:
              catalog: ${var.catalog}
          description: "MLflow LightGBM sales forecast per product, accuracy, and the combined gold.sales_forecast view"

        - task_key: sync_forecast_to_lakebase
          depends_on:
            - task_key: run_forecast
          pipeline_task:
            pipeline_id: ${resources.postgres_synced_tables.forecast_sync.status.pipeline_id}
          description: "Refresh the Lakebase copy of gold.launch_forecasts used by the app"
