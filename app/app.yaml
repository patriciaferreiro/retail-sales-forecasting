command:
  - uvicorn
  - backend.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: FORECAST_JOB_ID
    valueFrom: forecast-job
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: CATALOG
    value: patricia_aws_serverless_catalog
  - name: APP_DB_SCHEMA
    value: review
  - name: FORECAST_SYNCED_TABLE
    value: gold.launch_forecasts_synced
